<title>Thank You</title>
<meta property="og:title" content="Thank you · Ladies' Wine Tasting">
<meta property="og:description" content="A lovely evening. Here's how to settle up.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500&display=swap">
<style>
  /* Layout: same plum card as the invitation, followed by a cream "settle up" card. Single committed dark look. */
  :root {
    --ground: #1E0A15; --card: #3A1226; --card-deep: #220A18;
    --gold: #D6B36A; --gold-dim: rgba(214,179,106,.55);
    --cream: #F6E9D2; --cream-soft: #E3CFA6; --berry: #B1304A; --pine: #4C6B55;
    --paper: #F7EFE1; --paper-line: #D9C9AA; --ink: #2B1620; --ink-soft: #6F5B62;
    --display: "Cormorant Garamond", "Garamond", "Georgia", serif;
    --body: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--cream);
    font-family: var(--body); font-size: 16px; line-height: 1.5;
    padding-block: 18px 36px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 430px; margin: 0 auto; display: grid; gap: 16px; }
  .card {
    position: relative; border-radius: 6px; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, var(--card) 0%, var(--card-deep) 100%);
    box-shadow: 0 30px 70px rgba(0,0,0,.5); padding: 14px;
  }
  .frame {
    position: relative; text-align: center; min-width: 0;
    border: 1px solid var(--gold); outline: 1px solid var(--gold-dim); outline-offset: 3px;
    padding: 46px 18px 34px;
  }
  .art { position: absolute; pointer-events: none; }
  .corner { width: 118px; height: 118px; }
  .corner.tl { top: -2px; left: -2px; }
  .corner.br { bottom: -2px; right: -2px; transform: rotate(180deg); }
  .sparkle { width: 12px; height: 12px; opacity: .7; }
  .glasses { display: block; margin: 0 auto 14px; width: 84px; height: 70px; }
  .eyebrow { margin: 0 0 8px; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold); font-weight: 500; }
  h1 { margin: 0; font-family: var(--display); font-weight: 500; font-style: italic; font-size: clamp(36px, 10vw, 46px); line-height: 1.02; color: var(--cream); text-wrap: balance; }
  .orn { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 18px auto 16px; color: var(--gold); }
  .orn::before, .orn::after { content: ""; width: 56px; height: 1px; background: var(--gold); opacity: .8; }
  .orn svg { width: 10px; height: 10px; }
  .note { margin: 0 auto; max-width: 36ch; font-family: var(--display); font-size: 19px; line-height: 1.45; color: var(--cream-soft); }
  .note em { font-style: italic; color: var(--cream); }
  .sign { margin: 18px 0 0; font-family: var(--display); font-style: italic; font-size: 20px; color: var(--gold); }

  /* Settle-up card */
  .settle { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 22px 18px 20px; box-shadow: 0 16px 40px rgba(0,0,0,.35); color-scheme: light; position: relative; }
  .settle::before { content: ""; position: absolute; inset: 7px; border: 1px solid var(--paper-line); border-radius: 3px; pointer-events: none; }
  .settle > * { position: relative; }
  .settle h2 { font-family: var(--display); font-weight: 500; font-size: 28px; margin: 0 0 4px; color: var(--card); line-height: 1.1; }
  .settle .lede { margin: 0 0 16px; color: var(--ink-soft); font-size: 14px; }
  .flbl { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; margin-bottom: 8px; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 18px; }
  .seg button { font: 500 14px var(--body); padding: 12px 8px; border-radius: 4px; cursor: pointer; border: 1px solid var(--card); background: #fff; color: var(--card); display: grid; gap: 2px; }
  .seg button b { font: 600 20px var(--display); letter-spacing: .01em; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--cream); }
  .seg.one { grid-template-columns: 1fr; }
  .pay { display: grid; gap: 8px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; font: 500 14px var(--body); letter-spacing: .12em; text-transform: uppercase; padding: 14px; border-radius: 4px; border: 1px solid var(--card); cursor: pointer; text-decoration: none; color: var(--card); background: #fff; }
  .btn.primary { background: var(--card); color: var(--cream); }
  .btn:hover { filter: brightness(1.05); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn:focus-visible, .seg button:focus-visible, .zbtn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .zelle { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--paper-line); border-radius: 4px; padding: 10px 12px; background: #fff; }
  .zelle .z { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); font-weight: 500; }
  .zelle .v { font-size: 16px; color: var(--ink); font-variant-numeric: tabular-nums; user-select: all; }
  .zbtn { font: 500 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--card); background: none; border: 1px solid var(--card); border-radius: 999px; padding: 7px 12px; cursor: pointer; flex: none; }
  .small { font-size: 12px; color: var(--ink-soft); margin: 12px 0 0; text-align: center; }
  .foot { text-align: center; font-size: 10px; color: rgba(246,233,210,.5); letter-spacing: .2em; text-transform: uppercase; }

  /* Motion: same quiet shimmer as the invitation */
  @media (prefers-reduced-motion: no-preference) {
    .corner .vine { stroke-dasharray: 320; animation: draw 1.8s ease-out both; }
    .corner .pop { animation: pop .5s ease-out both; }
    .corner .pop:nth-of-type(1) { animation-delay: .9s } .corner .pop:nth-of-type(2) { animation-delay: 1.05s }
    .corner .pop:nth-of-type(3) { animation-delay: 1.2s } .corner .pop:nth-of-type(4) { animation-delay: 1.35s } .corner .pop:nth-of-type(5) { animation-delay: 1.5s }
    .corner { animation: glow 5s ease-in-out 2.5s infinite; }
    .sparkle { animation: twinkle 3.2s ease-in-out infinite; }
    .sparkle.s2 { animation-delay: .8s; animation-duration: 4.1s } .sparkle.s3 { animation-delay: 1.6s; animation-duration: 2.7s } .sparkle.s4 { animation-delay: 2.3s; animation-duration: 3.6s } .sparkle.s5 { animation-delay: 1.1s; animation-duration: 4.6s } .sparkle.s6 { animation-delay: 2.9s; animation-duration: 3.9s } .sparkle.s7 { animation-delay: .4s; animation-duration: 5.2s }
    .glasses { animation: clink 6s ease-in-out 1.2s infinite; transform-origin: 50% 90%; }
    .frame { animation: breathe 6s ease-in-out 2s infinite; }
    .frame::after { content: ""; position: absolute; inset: -1px; pointer-events: none; background: linear-gradient(115deg, transparent 42%, rgba(255,244,214,.07) 50%, transparent 58%); background-size: 260% 100%; animation: sweep 9s ease-in-out 2.5s infinite; }
    h1 { background: linear-gradient(110deg, var(--cream) 40%, #FFF7E0 50%, var(--cream) 60%); background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; animation: lift .8s ease-out .4s both, sheen 7s ease-in-out 2.5s infinite; }
    .eyebrow, .orn, .note, .sign { animation: lift .8s ease-out both; }
    .eyebrow { animation-delay: .3s } .orn { animation-delay: .6s } .note { animation-delay: .75s } .sign { animation-delay: .9s }
  }
  @keyframes draw { from { stroke-dashoffset: 320 } to { stroke-dashoffset: 0 } }
  @keyframes pop { from { opacity: 0; transform: scale(.4) } to { opacity: 1; transform: scale(1) } }
  @keyframes lift { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.7) rotate(0deg) } 50% { opacity: 1; transform: scale(1.15) rotate(20deg) } }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(214,179,106,0); border-color: var(--gold) } 50% { box-shadow: 0 0 22px 0 rgba(214,179,106,.28), inset 0 0 18px rgba(214,179,106,.08); border-color: #EAD08E } }
  @keyframes sweep { 0% { background-position: 130% 0 } 35%,100% { background-position: -130% 0 } }
  @keyframes sheen { 0% { background-position: 130% 0 } 40%,100% { background-position: -130% 0 } }
  @keyframes glow { 0%,100% { opacity: .85; filter: drop-shadow(0 0 0 rgba(214,179,106,0)) } 50% { opacity: 1; filter: drop-shadow(0 0 3px rgba(214,179,106,.55)) } }
  @keyframes clink { 0%,100% { transform: rotate(0deg) } 6% { transform: rotate(-2deg) } 12% { transform: rotate(1.5deg) } 18% { transform: rotate(0deg) } }
</style>
</head><body>

<div class="wrap">
  <section class="card" aria-label="Thank you">
    <div class="frame">

        <path class="vine" d="M6 4 C 10 30, 40 40, 36 70 S 20 104, 6 114" fill="none" stroke="#D6B36A" stroke-width="1.1" stroke-linecap="round"/>
        <g class="pop" style="transform-origin:46px 30px"><path d="M46 20 L46 40 M46 24 L40 30 M46 24 L52 30 M46 30 L40 36 M46 30 L52 36" stroke="#4C6B55" stroke-width="1.3" stroke-linecap="round" fill="none"/></g>
        <g class="pop" style="transform-origin:30px 46px"><path d="M20 46 L40 46 M24 46 L30 40 M24 46 L30 52 M30 46 L36 40 M30 46 L36 52" stroke="#4C6B55" stroke-width="1.3" stroke-linecap="round" fill="none"/></g>
        <g class="pop" style="transform-origin:22px 22px"><circle cx="19" cy="19" r="3" fill="#B1304A"/><circle cx="25" cy="22" r="3" fill="#B1304A"/><circle cx="21" cy="26" r="3" fill="#B1304A"/></g>
        <g class="pop" style="transform-origin:84px 28px"><path d="M78 28 Q84 20 90 28 Q84 36 78 28 Z" fill="#D6B36A"/></g>
        <g class="pop" style="transform-origin:28px 84px"><path d="M28 78 Q36 84 28 90 Q20 84 28 78 Z" fill="#D6B36A"/></g>

      <svg class="art sparkle s1" style="top:16%;right:12%" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>
      <svg class="art sparkle s2" style="top:34%;left:9%" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>
      <svg class="art sparkle s3" style="top:56%;right:9%" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>
      <svg class="art sparkle s4" style="bottom:30%;left:11%;width:8px;height:8px" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>
      <svg class="art sparkle s5" style="top:10%;left:40%;width:8px;height:8px" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>
      <svg class="art sparkle s6" style="top:12%;right:34%;width:7px;height:7px" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>
      <svg class="art sparkle s7" style="bottom:18%;right:22%;width:9px;height:9px" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 L7 5 L12 6 L7 7 L6 12 L5 7 L0 6 L5 5 Z" fill="#D6B36A"/></svg>

      <!-- Two glasses meeting -->
      <svg class="glasses" viewBox="0 0 84 70" aria-hidden="true">

          <path d="M14 4 H42 Q42 34 28 38 Q14 34 14 4 Z" fill="#8E2443" stroke="#D6B36A" stroke-width="1.3"/>

      <p class="eyebrow" id="eyebrow">Thank you</p>

  <section class="settle" aria-label="Settle up">

<script>
/* ========= SETTLE-UP SETTINGS — fill in after the event ========= */
const SETTLE = {
  eventName: "Ladies' Wine Tasting",
  title: "What a lovely evening",
  note: "Thank you for coming, for the laughter, and for making our sommelier work for it. A real pleasure to end the semester with all of you.",
  sign: "— Shen",
  foot: "Until the next one",
  payNote: "Wine tasting · Dec 4",
  // Per-person amounts. Add or remove options; one option hides the chooser.
  options: [
    { label: "Tasting only", amount: 47 },
    { label: "Tasting + dinner", amount: 85 }
  ],
  // Payment handles — leave any blank to hide that button
  venmo: "",              // e.g. "Shen-Example" (the part after venmo.com/ or your @handle without the @)
  paypal: "",             // e.g. "shenexample" (the part after paypal.me/)
  zelle: "",              // e.g. "(555) 123-4567" or an email — shown as text with a Copy button
  smallPrint: "No rush at all. Amounts are the split of what was paid to the vendor."
};
/* ================================================================== */

const $ = id => document.getElementById(id);
const money = n => "$" + (Number.isInteger(n) ? n : n.toFixed(2));
$("title").textContent = SETTLE.title; $("note").textContent = SETTLE.note; $("sign").textContent = SETTLE.sign;
$("foot").textContent = SETTLE.foot; $("small").textContent = SETTLE.smallPrint; document.title = "Thank you · " + SETTLE.eventName;

const opts = SETTLE.options.filter(o => o && o.amount > 0);
let chosen = 0;
const seg = $("seg");
if (opts.length <= 1) { seg.hidden = true; $("choose-lbl").hidden = true; }
else if (opts.length === 1) seg.classList.add("one");
opts.forEach((o, i) => {
  const b = document.createElement("button"); b.type = "button";
  b.innerHTML = "<span>" + o.label + "</span><b>" + money(o.amount) + "</b>";
  b.setAttribute("aria-pressed", i === chosen); b.onclick = () => { chosen = i; render(); };
  seg.appendChild(b);
});
$("lede").textContent = opts.length > 1
  ? "Pick what you joined and tap a button below. The amount is filled in for you."
  : (opts.length === 1 ? "It came to " + money(opts[0].amount) + " each. Tap a button and the amount is filled in for you." : "Amounts to follow.");

const icon = {
  venmo: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.5 3c.7 1.1 1 2.3 1 3.8 0 4.7-4 10.8-7.3 15.1H5.8L3 5.2l6.5-.6 1.6 12.6c1.5-2.4 3.3-6.1 3.3-8.7 0-1.4-.2-2.4-.6-3.2L19.5 3z"/></svg>',
  paypal: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.2 21l.6-3.6H5.2L7.6 3h6.9c3.2 0 5 1.6 4.6 4.5-.5 3.6-2.9 5.4-6.4 5.4h-2.1l-.9 5.3H12l-.5 2.8H7.2z"/></svg>'
};
function render() {
  [...seg.children].forEach((b, i) => b.setAttribute("aria-pressed", i === chosen));
  const amt = opts[chosen] ? opts[chosen].amount : 0;
  const note = encodeURIComponent(SETTLE.payNote + (opts.length > 1 && opts[chosen] ? " · " + opts[chosen].label : ""));
  const pay = $("pay"); pay.innerHTML = "";
  if (SETTLE.venmo) {
    const a = document.createElement("a"); a.className = "btn primary"; a.target = "_blank"; a.rel = "noopener";
    a.href = "https://venmo.com/" + encodeURIComponent(SETTLE.venmo) + "?txn=pay" + (amt ? "&amount=" + amt : "") + "&note=" + note;
    a.innerHTML = icon.venmo + "Pay with Venmo"; pay.appendChild(a);
  }
  if (SETTLE.paypal) {
    const a = document.createElement("a"); a.className = "btn"; a.target = "_blank"; a.rel = "noopener";
    a.href = "https://paypal.me/" + encodeURIComponent(SETTLE.paypal) + (amt ? "/" + amt + "USD" : "");
    a.innerHTML = icon.paypal + "Pay with PayPal"; pay.appendChild(a);
  }
  if (SETTLE.zelle) {
    const d = document.createElement("div"); d.className = "zelle";
    d.innerHTML = '<div><div class="z">Zelle</div><div class="v" id="zv"></div></div><button type="button" class="zbtn" id="zc">Copy</button>';
    pay.appendChild(d); $("zv").textContent = SETTLE.zelle;
    $("zc").onclick = async () => {
      try { await navigator.clipboard.writeText(SETTLE.zelle); $("zc").textContent = "Copied"; }
      catch (e) { const r = document.createRange(); r.selectNodeContents($("zv")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("zc").textContent = "Selected"; }
      setTimeout(() => $("zc").textContent = "Copy", 1800);
    };
  }
  if (!SETTLE.venmo && !SETTLE.paypal && !SETTLE.zelle) {
    const p = document.createElement("p"); p.className = "small"; p.textContent = "Payment options will appear here once they're set up."; pay.appendChild(p);
  }
}
render();
</script>
</body></html>
